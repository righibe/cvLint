name: cvlint

services:
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
    image: cvlint-web:latest
    restart: unless-stopped
    # Hardened container: read-only root, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
    # Only reachable by Caddy, and with no route to the internet (it needs none).
    networks: [backend]
    expose: ["3000"]

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    networks: [edge, backend]

networks:
  # Public side: Caddy needs internet access for Let's Encrypt.
  edge: {}
  # Private side: internal-only, no egress.
  backend:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
